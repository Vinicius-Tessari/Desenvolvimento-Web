<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>TRATAMENTO DE EXCEÇÕES</h1>
        <p><strong> Try e Catch</strong></p>
        <section>
            <h2>Exemplo 1: Verificação de idade</h2>
            <label for="idade">Digite sua idade:</label>
            <input type="number" id="idade" placeholder="Ex.: 20">
            <button type="button" id="verificar">Verificar acesso</button>
            <p id="resultadoIdade" class="resultado">O resultado aparecerá aqui.</p>
            <p id="finalizacaoIdade" class="observacao"></p>
        </section>
        <section>
            <h2>Exemplo 2: Calculadora com validação</h2>
            <label for="numero1">Primeiro número:</label>
            <input type="number" id="numero1" placeholder="Ex.: 28">
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" placeholder="Ex.: 4">
            <button type="button" id="dividir">Dividir</button>
            <p id="resultadoDivisao" class="resultado">O resultado será exibido aqui.</p>
            <p id="finalizacaoDivisao" class="observacao"></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
